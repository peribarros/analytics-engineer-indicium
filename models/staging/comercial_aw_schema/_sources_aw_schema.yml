version: 2

sources:
  - name: comercial
    description: "Dados brutos de origem do ecossistema Adventure Works."
    database: adventure_works
    schema: comercial_aw_schema
    
    # Teste de freshness (latência dos dados brutos)
    config:
      freshness:
        warn_after: {count: 12, period: hour}  # Alerta se os dados brutos não mudarem há mais de 12h
        error_after: {count: 24, period: hour} # Erro se ultrapassarem 24h sem atualização na origem
    
    tables:
      - name: person_address
        description: "Registro de endereços de clientes, funcionários e fornecedores."
        columns:
          - name: addressid
            description: "Chave primária da tabela de endereços."
            data_tests:
              - unique    # Valida unicidade na fonte bruta
              - not_null  # Valida ausência de nulos na fonte bruta

      - name: person_countryregion
        description: "Tabela de referência para países e regiões."
        columns:
          - name: countryregioncode
            description: "Chave primária do país/região."
            data_tests:
              - unique
              - not_null

      - name: person_person
        description: "Registro central de pessoas (clientes individuais, contactos de empresas e funcionários)."
        columns:
          - name: businessentityid
            description: "Chave primária da entidade de pessoa."
            data_tests:
              - unique
              - not_null

      - name: person_stateprovince
        description: "Tabela de referência para estados e províncias associadas a países."
        columns:
          - name: stateprovinceid
            description: "Chave primária do estado/província."
            data_tests:
              - unique
              - not_null

      - name: production_product
        description: "Catálogo de produtos fabricados e vendidos pela empresa."
        columns:
          - name: productid
            description: "Chave primária do produto."
            data_tests:
              - unique
              - not_null
          - name: standardcost
            description: "Custo padrão de fabricação do produto."
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 999999  # Garante que o custo padrão não pode ser negativo

      - name: sales_creditcard
        description: "Informações e dados das cartões de crédito associados às vendas."
        columns:
          - name: creditcardid
            description: "Chave primária do cartão de crédito."
            data_tests:
              - unique
              - not_null

      - name: sales_customer
        description: "Registo de clientes da loja física ou e-commerce."
        columns:
          - name: customerid
            description: "Chave primária do cliente."
            data_tests:
              - unique
              - not_null

      - name: sales_salesorderheader
        description: "Cabeçalho dos pedidos de venda com informações gerais do pedido (valores, datas e status)."
        columns:
          - name: salesorderid
            description: "Chave primária do pedido de venda."
            data_tests:
              - unique
              - not_null
          - name: status
            description: "Estado do pedido de venda (1=Em processamento, 2=Aprovado, 3=Em espera, 4=Rejeitado, 5=Enviado, 6=Cancelado)."
            data_tests:
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6]  # Formato correto com arguments
          - name: totaldue
            description: "Valor total devido do pedido."
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 99999999  # Garante que o valor total devido não possui montantes negativos

      - name: sales_salesorderheadersalesreason
        description: "Mapeamento entre os pedidos de venda e os respetivos motivos de venda."
        columns:
          - name: salesorderid
            description: "Identificador do pedido de venda."
            data_tests:
              - not_null
          - name: salesreasonid
            description: "Identificador do motivo de venda."
            data_tests:
              - not_null

      - name: sales_salesreason
        description: "Tabela com as razões/motivos pelos quais as vendas foram realizadas."
        columns:
          - name: salesreasonid
            description: "Chave primária do motivo de venda."
            data_tests:
              - unique
              - not_null

      - name: sales_salesorderdetail
        description: "Detalhes dos itens de cada pedido de venda (produtos, quantidades e valores)."
        columns:
          - name: salesorderid
            description: "Identificador do pedido de venda."
            data_tests:
              - not_null
          - name: salesorderdetailid
            description: "Identificador único do detalhe/item do pedido."
            data_tests:
              - unique
              - not_null
          - name: productid
            description: "Identificador do produto associado ao item."
            data_tests:
              - not_null